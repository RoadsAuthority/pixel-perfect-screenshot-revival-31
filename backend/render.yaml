# render.yaml — Infrastructure-as-code for Render
# Commit this file; Render reads it automatically when you connect the repo.
#
# Docs: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: clinic-archive-api
    runtime: python
    region: oregon          # change to frankfurt if you want EU (closer to eu-north-1 AWS)
    plan: starter           # free tier; upgrade to standard for always-on

    # Render runs commands from the repo root by default.
    # rootDir scopes the build to the backend/ folder.
    rootDir: backend

    buildCommand: pip install -r src/requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      # ── AWS region ────────────────────────────────────────────────────────
      - key: AWS_REGION
        value: eu-north-1

      # ── AWS credentials (set these as secret values in the Render dashboard,
      #    never commit actual keys here) ────────────────────────────────────
      - key: AWS_ACCESS_KEY_ID
        sync: false          # Render will prompt you to enter the value

      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # ── App config (match the names in handler.py / main.py) ─────────────
      - key: KB_ID
        sync: false          # your Bedrock Knowledge Base ID

      - key: AUDIT_TABLE
        sync: false          # DynamoDB audit table name

      - key: BUCKET_NAME
        sync: false          # S3 archive bucket name

      - key: AUTH_USERS_TABLE
        sync: false          # DynamoDB users table name

      - key: AUTH_SESSIONS_TABLE
        sync: false          # DynamoDB sessions table name

      - key: GENERATION_MODEL_ARN
        sync: false          # e.g. arn:aws:bedrock:eu-north-1::foundation-model/anthropic.claude-3-haiku-20240307-v1:0

      # ── CORS ─────────────────────────────────────────────────────────────
      - key: ALLOWED_ORIGIN
        value: "*"           # replace with https://your-app.lovable.app before going live
